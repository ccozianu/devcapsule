[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devcapsule"
version = "0.1.0"
description = "Profile-driven Docker launch tooling for isolated IDE development environments."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "DevCapsule contributors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "click>=8.1,<9",
  "python-on-whales>=0.81.0,<0.82",
]

[project.optional-dependencies]
dev = [
  "genbadge[coverage]>=1.1,<2",
  "mypy>=2.3,<3",
  "nox>=2025.5,<2027",
  "pex>=2.20,<3",
  "pip-tools>=7.5,<8",
  "pytest>=7.4",
  "pytest-cov>=5,<8",
]

[project.scripts]
devcapsule = "devcapsule.cli:main"
devcapsule-runtime = "devcapsule_runtime.entrypoint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["devcapsule*"]

[tool.setuptools.package-data]
"devcapsule" = [
  "_build_info.json",
]
"devcapsule.assets.docker4pycharm" = [
  "Dockerfile",
  "*.sh",
  "image-assets/*.md",
]
"devcapsule.assets.pycharm" = [
  "*.sh",
  "image-assets/*.md",
]
"devcapsule.assets.codium_with_claude" = [
  "*.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--cov=devcapsule",
  "--cov-report=term-missing",
  "-m",
  "not integration and not e2e",
]
markers = [
  "integration: crosses packaging or process boundaries without Docker",
  "e2e: builds or runs real Docker images and containers",
]

[tool.coverage.run]
branch = true
source = ["devcapsule", "devcapsule_runtime"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
files = ["devcapsule", "devcapsule_runtime", "tests", "noxfile.py"]
warn_unused_configs = true
show_error_codes = true
pretty = true
