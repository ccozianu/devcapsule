name: Tests and coverage

# The unit suite with coverage runs on every push to main and on every pull
# request against main or a release branch, so a contributor sees the result
# and the coverage summary before the merge; the badge is published from main
# alone. The owner may make the "Python 3.12" check required in the
# repository rules. First run under the release-branch trigger: pull request
# #226, 2026-10-18, run 39146118222.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch, tag, or commit SHA to test (blank uses the selected workflow branch)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Rapid pushes to the same branch or pull request cancel older runs. Manual
  # runs are independent.
  group: tests-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python 3.12
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: devcapsule-src

    steps:
      - name: Wait for newer pushes
        if: github.event_name == 'push'
        run: sleep 30
        working-directory: .

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: devcapsule-src/dev-requirements.txt

      - name: Install contributor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt
          python -m pip install -e . --no-deps

      - name: Run tests with coverage
        run: >-
          python -m pytest tests/
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('devcapsule-src/.coverage') != '' }}
        run: |
          {
            echo '## Python test coverage'
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ always() && hashFiles('devcapsule-src/coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            devcapsule-src/coverage.xml
            devcapsule-src/htmlcov/
          if-no-files-found: error
          retention-days: 30

  publish-coverage-badge:
    name: Publish coverage badge
    needs: pytest
    if: github.event_name == 'push' && github.repository == 'ccozianu/devcapsule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: devcapsule-src/dev-requirements.txt

      - name: Install badge generator
        run: python -m pip install -r devcapsule-src/dev-requirements.txt

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: devcapsule-src

      - name: Generate coverage badge
        run: >-
          genbadge coverage
          --input-file devcapsule-src/coverage.xml
          --output-file "$RUNNER_TEMP/coverage.svg"
          --local

      # The badge lives on the project-owned `badges` publication branch, never
      # on `main`, so every first-parent commit on `main` stays a pull-request
      # merge (WORKFLOW-LOCAL.md, Publication Refs). The branch is advanced by
      # fast-forward commits built with plumbing commands; the checkout of the
      # tested commit is never modified.
      - name: Publish the badge on the badges branch without changing main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w "$RUNNER_TEMP/coverage.svg")
          parent_args=()
          if git ls-remote --exit-code origin refs/heads/badges > /dev/null; then
            git fetch --depth=1 origin refs/heads/badges
            parent=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse --verify --quiet "$parent:coverage.svg")" = "$blob" ]; then
              echo "Coverage badge is already current."
              exit 0
            fi
            parent_args=(-p "$parent")
          else
            result=$?
            if [ "$result" != 2 ]; then exit "$result"; fi
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/badges-index"
          if [ "${#parent_args[@]}" -gt 0 ]; then
            git read-tree "$parent"
          else
            git read-tree --empty
          fi
          git update-index --add --cacheinfo "100644,$blob,coverage.svg"
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" "${parent_args[@]}" -m "Coverage badge for main at ${GITHUB_SHA::12}")
          git push origin "$commit:refs/heads/badges"
