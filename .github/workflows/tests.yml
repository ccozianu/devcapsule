name: Tests and coverage

# Required check migration: establish ci-gate on a real PR, then have the
# owner replace only the old Python 3.12 requirement. Preserve other checks.
# Coverage is advisory; failures to run tests or produce reports still fail.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release-*
  merge_group:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Branch, tag, or commit SHA to test (blank uses the selected workflow branch)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Rapid pushes to the same branch or pull request cancel older runs. Manual
  # runs are independent.
  group: tests-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select verification jobs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.route.outputs.python }}
      docs: ${{ steps.route.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.checkout_ref || github.sha }}
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: .github/ci-paths.yml
      # tests/test_ci_reporting.py runs this script with each kind of input.
      - name: Validate route or select full verification
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PYTHON_CHANGED: ${{ steps.filter.outputs.python }}
          DOCS_CHANGED: ${{ steps.filter.outputs.docs }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            python=true
            docs=true
          elif [[ ! "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "The pull request event carries no changed-file count." >&2
            exit 1
          elif (( CHANGED_FILES > 3000 )); then
            # GitHub lists at most 3000 files of a pull request, so the filter
            # saw only part of this one. Run everything.
            python=true
            docs=true
          else
            for value in "$PYTHON_CHANGED" "$DOCS_CHANGED"; do
              if [[ "$value" != true && "$value" != false ]]; then
                echo "The path filter produced no valid route: '$value'." >&2
                exit 1
              fi
            done
            python=$PYTHON_CHANGED
            docs=$DOCS_CHANGED
          fi
          printf 'python=%s\ndocs=%s\n' "$python" "$docs" >> "$GITHUB_OUTPUT"

  docs-build:
    name: Website verification
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    env:
      SITE_MODE: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch documentation refs and the pinned website implementation
        run: |
          git fetch origin '+refs/heads/docs-*:refs/heads/docs-*'
          git config submodule.website.url https://github.com/ccozianu/devcapsule-website.git
          git submodule update --init website
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: ./scripts/website.sh install
      - run: npm --prefix website test
      - run: ./scripts/website.sh build

  pytest:
    name: Python 3.12
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: devcapsule-src

    steps:
      - name: Wait for newer pushes
        if: github.event_name == 'push'
        run: sleep 30
        working-directory: .

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.checkout_ref || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: devcapsule-src/dev-requirements.txt

      - name: Install contributor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt
          python -m pip install -e . --no-deps

      - name: Run tests with coverage
        run: >-
          python -m pytest tests/
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      # Test PR head and compare its merge-base with the event's exact base SHA.
      # This keeps coverage and annotation coordinates on the same PR revision.
      - name: Compute advisory diff coverage
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$PR_BASE_SHA^{commit}"
          git merge-base "$PR_BASE_SHA" HEAD
          diff-cover coverage.xml --compare-branch="$PR_BASE_SHA" \
            --ignore-staged --ignore-unstaged \
            --format markdown:diff-cover.md,json:diff-cover.json
          python scripts/diff_coverage_annotations.py

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('devcapsule-src/.coverage') != '' }}
        run: |
          {
            echo '## Python test coverage'
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ always() && hashFiles('devcapsule-src/coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            devcapsule-src/coverage.xml
            devcapsule-src/htmlcov/
            devcapsule-src/diff-cover.md
            devcapsule-src/diff-cover.json
          if-no-files-found: error
          retention-days: 30

  ci-gate:
    name: ci-gate
    needs: [changes, docs-build, pytest]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual runs may test an old ref without the gate script. Use the
          # implementation belonging to this workflow, not the test target.
          ref: ${{ github.workflow_sha }}
      - name: Require successful routing and applicable jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 devcapsule-src/scripts/ci_gate.py

  publish-coverage-badge:
    name: Publish coverage badge
    needs: pytest
    if: github.event_name == 'push' && github.repository == 'ccozianu/devcapsule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: devcapsule-src/dev-requirements.txt

      - name: Install badge generator
        run: python -m pip install -r devcapsule-src/dev-requirements.txt

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: devcapsule-src

      - name: Generate coverage badge
        run: >-
          genbadge coverage
          --input-file devcapsule-src/coverage.xml
          --output-file "$RUNNER_TEMP/coverage.svg"
          --local

      # The badge lives on the project-owned `badges` publication branch, never
      # on `main`, so every first-parent commit on `main` stays a pull-request
      # merge (WORKFLOW-LOCAL.md, Publication Refs). The branch is advanced by
      # fast-forward commits built with plumbing commands; the checkout of the
      # tested commit is never modified.
      - name: Publish the badge on the badges branch without changing main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w "$RUNNER_TEMP/coverage.svg")
          parent_args=()
          if git ls-remote --exit-code origin refs/heads/badges > /dev/null; then
            git fetch --depth=1 origin refs/heads/badges
            parent=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse --verify --quiet "$parent:coverage.svg")" = "$blob" ]; then
              echo "Coverage badge is already current."
              exit 0
            fi
            parent_args=(-p "$parent")
          else
            result=$?
            if [ "$result" != 2 ]; then exit "$result"; fi
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/badges-index"
          if [ "${#parent_args[@]}" -gt 0 ]; then
            git read-tree "$parent"
          else
            git read-tree --empty
          fi
          git update-index --add --cacheinfo "100644,$blob,coverage.svg"
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" "${parent_args[@]}" -m "Coverage badge for main at ${GITHUB_SHA::12}")
          git push origin "$commit:refs/heads/badges"
