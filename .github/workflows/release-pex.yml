name: Publish DevCapsule PEX

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (or verify again)
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-pex-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  # The Linux x86-64 executable, devcapsule.pex, is built and proven below.
  # These are the other platforms' executables of the same tag, each built on
  # its own architecture: the install script picks the one for the computer,
  # and on a Mac also takes both Linux ones as the runtimes its capsules run.
  build-other-platforms:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            scie-platform: linux-aarch64
            asset: devcapsule-linux-arm64
          - runner: macos-15
            scie-platform: macos-aarch64
            asset: devcapsule-macos-arm64
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    defaults:
      run:
        working-directory: devcapsule-src

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Python 3.12 for the backend build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: devcapsule-src/dev-requirements.txt

      - name: Install locked build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt
          python -m pip install -e . --no-deps

      - name: Build and smoke the self-contained executable
        env:
          DEVCAPSULE_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          DEVCAPSULE_SCIE_PLATFORM: ${{ matrix.scie-platform }}
          ASSET: ${{ matrix.asset }}
        run: |
          scripts/build-pex.sh \
            --source-revision "$(git rev-parse HEAD)" \
            --release-mnemonic "$RELEASE_TAG" \
            --output "dist/$ASSET"
          "dist/$ASSET" --help >/dev/null
          "dist/$ASSET" version --json | tee "$RUNNER_TEMP/version.json"
          test "$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["build_mnemonic"])' "$RUNNER_TEMP/version.json")" = "$RELEASE_TAG"

      - name: Hand the executable to the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: devcapsule-src/dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 30

  build-publish-and-prove:
    name: Build, publish, and prove
    needs: build-other-platforms
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: devcapsule-src

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify the selected tag and revision
        run: |
          python3 scripts/release-protocol.py "$RELEASE_TAG" --output "$RUNNER_TEMP/release-gate.json"

      - name: Set up Python 3.12 for the backend build
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: devcapsule-src/dev-requirements.txt

      - name: Install locked build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-requirements.txt
          python -m pip install -e . --no-deps

      - name: Verify the documentation obligations
        if: env.RELEASE_PRERELEASE == 'false'
        working-directory: .
        run: |
          version="${RELEASE_TAG#v}"
          python devcapsule-src/scripts/release-docs.py check "$version"
          git fetch origin "refs/heads/docs-$version"
          git diff --quiet FETCH_HEAD "$RELEASE_TAG" -- docs/

      - name: Run source tests and type checks
        run: python -m nox -s syntax tests typecheck

      - name: Verify accepted candidate assets
        if: env.RELEASE_PRERELEASE == 'false'
        run: |
          candidate="$RUNNER_TEMP/accepted-candidate"
          mkdir -p "$candidate"
          test "$(gh release view "$ACCEPTED_CANDIDATE" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @json')" = '[false,true]'
          gh release download "$ACCEPTED_CANDIDATE" --dir "$candidate" \
            --pattern devcapsule.pex --pattern devcapsule.pex.sha256 --pattern release-manifest.json
          (cd "$candidate" && sha256sum --check devcapsule.pex.sha256)
          python - "$candidate" "$RUNNER_TEMP/release-gate.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          record = json.load(open(sys.argv[2]))["promotion"]["record"]
          assert hashlib.sha256((path / "devcapsule.pex").read_bytes()).hexdigest() == record["candidate-sha256"]
          PY

      - name: Recover previously staged artifacts
        id: recover
        run: |
          mkdir -p dist
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/releases"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/releases"; then
            gh release download "$RELEASE_TAG" --dir dist \
              --pattern devcapsule.pex --pattern devcapsule.pex.sha256 \
              --pattern devcapsule-linux-arm64 --pattern devcapsule-macos-arm64 \
              --pattern SHA256SUMS --pattern install.sh \
              --pattern release-manifest.json
            (cd dist && sha256sum --check devcapsule.pex.sha256 && sha256sum --check SHA256SUMS)
            chmod 0755 dist/devcapsule.pex dist/devcapsule-linux-arm64 dist/devcapsule-macos-arm64
            manifest_args=(--gate "$RUNNER_TEMP/release-gate.json"
              --artifact dist/devcapsule-linux-arm64 --artifact dist/devcapsule-macos-arm64)
            if [ "$RELEASE_PRERELEASE" = false ]; then
              manifest_args+=(--candidate "$RUNNER_TEMP/accepted-candidate/release-manifest.json")
            fi
            python scripts/release-manifest.py "$RELEASE_TAG" "$(git rev-parse HEAD)" "${manifest_args[@]}" --verify
            chmod 0755 dist/devcapsule.pex
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Take the other platforms' executables
        if: steps.recover.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: devcapsule-*-arm64
          merge-multiple: true
          path: devcapsule-src/dist

      - name: Build the self-contained release PEX
        if: steps.recover.outputs.exists != 'true'
        env:
          DEVCAPSULE_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          scripts/build-pex.sh \
            --source-revision "$(git rev-parse HEAD)" \
            --release-mnemonic "$RELEASE_TAG"
          dist/devcapsule.pex --help >/dev/null
          dist/devcapsule.pex version --json | tee dist/devcapsule-version.json
          test "$(python -c 'import json; print(json.load(open("dist/devcapsule-version.json"))["build_mnemonic"])')" = "$RELEASE_TAG"
          chmod 0755 dist/devcapsule-linux-arm64 dist/devcapsule-macos-arm64
          (cd dist && sha256sum devcapsule.pex > devcapsule.pex.sha256)
          (cd dist && sha256sum devcapsule.pex devcapsule-linux-arm64 devcapsule-macos-arm64 > SHA256SUMS)
          manifest_args=(--gate "$RUNNER_TEMP/release-gate.json"
            --artifact dist/devcapsule-linux-arm64 --artifact dist/devcapsule-macos-arm64)
          if [ "$RELEASE_PRERELEASE" = false ]; then
            manifest_args+=(--candidate "$RUNNER_TEMP/accepted-candidate/release-manifest.json")
          fi
          python scripts/release-manifest.py "$RELEASE_TAG" "$(git rev-parse HEAD)" "${manifest_args[@]}"

      - name: Write the install script for this release
        run: |
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          sed "s|@RELEASE_URL@|$release_url|" scripts/install.sh > "$RUNNER_TEMP/install.sh"
          if grep -q '@RELEASE_URL@' "$RUNNER_TEMP/install.sh"; then exit 1; fi
          sh -n "$RUNNER_TEMP/install.sh"
          if [ "${{ steps.recover.outputs.exists }}" = true ]; then
            cmp "$RUNNER_TEMP/install.sh" dist/install.sh
          else
            install -m 0755 "$RUNNER_TEMP/install.sh" dist/install.sh
          fi

      - name: Run packaging integration tests against the release PEX
        env:
          DEVCAPSULE_PEX_UNDER_TEST: ${{ github.workspace }}/devcapsule-src/dist/devcapsule.pex
          DEVCAPSULE_EXPECTED_BUILD_MNEMONIC: ${{ env.RELEASE_TAG }}
        run: python -m pytest --no-cov -m integration tests/integration

      # No step here runs Docker. A hosted runner is an environment nobody
      # controls, and a proof that depends on it gates the candidate on the
      # runner rather than on the candidate (owner ruling 2026-09-24, after
      # v0.2.14-rc2 failed on a Docker build the rc1 run had passed hours
      # earlier). The clean-machine proof, component-cache reuse and
      # runtime-session checks run in the local acceptance campaign against
      # the downloaded assets; see the operator guide.

      - name: Retain the backend build
        uses: actions/upload-artifact@v4
        with:
          name: devcapsule-pex-${{ env.RELEASE_TAG }}
          path: |
            devcapsule-src/dist/devcapsule.pex
            devcapsule-src/dist/devcapsule.pex.sha256
            devcapsule-src/dist/devcapsule-linux-arm64
            devcapsule-src/dist/devcapsule-macos-arm64
            devcapsule-src/dist/SHA256SUMS
            devcapsule-src/dist/install.sh
            devcapsule-src/dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Stage the verified release
        if: steps.recover.outputs.exists != 'true' && env.RELEASE_PRERELEASE == 'true'
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/install.sh#Installer for Linux and Apple Silicon Macs" \
            "dist/devcapsule.pex#Self-contained Linux x86-64 CLI" \
            "dist/devcapsule-linux-arm64#Self-contained Linux ARM64 CLI (experimental)" \
            "dist/devcapsule-macos-arm64#Self-contained macOS Apple Silicon CLI (experimental)" \
            "dist/devcapsule.pex.sha256#SHA-256 checksum" \
            "dist/SHA256SUMS#SHA-256 checksums of every executable" \
            "dist/release-manifest.json#Release inputs and artifact checksums" \
            --verify-tag --generate-notes --draft --prerelease="$RELEASE_PRERELEASE" --latest=false

      - name: Stage the verified final release
        if: steps.recover.outputs.exists != 'true' && env.RELEASE_PRERELEASE == 'false'
        run: |
          python scripts/release-docs.py notes "${RELEASE_TAG#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            "dist/install.sh#Installer for Linux and Apple Silicon Macs" \
            "dist/devcapsule.pex#Self-contained Linux x86-64 CLI" \
            "dist/devcapsule-linux-arm64#Self-contained Linux ARM64 CLI (experimental)" \
            "dist/devcapsule-macos-arm64#Self-contained macOS Apple Silicon CLI (experimental)" \
            "dist/devcapsule.pex.sha256#SHA-256 checksum" \
            "dist/SHA256SUMS#SHA-256 checksums of every executable" \
            "dist/release-manifest.json#Release inputs and artifact checksums" \
            --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --draft --prerelease="$RELEASE_PRERELEASE" --latest=false

      - name: Download and verify the published assets
        run: |
          published="$RUNNER_TEMP/published-release"
          mkdir -p "$published"
          gh release download "$RELEASE_TAG" \
            --pattern devcapsule.pex \
            --pattern devcapsule.pex.sha256 \
            --pattern devcapsule-linux-arm64 \
            --pattern devcapsule-macos-arm64 \
            --pattern SHA256SUMS \
            --pattern install.sh \
            --pattern release-manifest.json \
            --dir "$published"
          (cd "$published" && sha256sum --check devcapsule.pex.sha256 && sha256sum --check SHA256SUMS)
          for asset in devcapsule.pex devcapsule-linux-arm64 devcapsule-macos-arm64 SHA256SUMS install.sh release-manifest.json; do
            cmp "dist/$asset" "$published/$asset"
          done
          chmod 0755 "$published/devcapsule.pex"

      - name: Publish the complete release
        run: |
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            # Let GitHub choose Latest
            # by semantic version so an older maintenance release cannot displace it.
            latest=legacy
            if [ "$RELEASE_PRERELEASE" = true ]; then latest=false; fi
            # The by-tag REST endpoint excludes drafts; list releases with the
            # authenticated token to obtain the staged release's numeric ID.
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
            [[ "$release_id" =~ ^[0-9]+$ ]]
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false -F prerelease="$RELEASE_PRERELEASE" -f make_latest="$latest" >/dev/null
          fi

      - name: Build the test website
        if: env.RELEASE_PRERELEASE == 'false'
        shell: bash
        run: |
          gh workflow run website.yml --ref main -f mode=production \
            -f site_origin=https://test-devcapsule.mycodespace.ai -f base_path=/ \
            | tee "$RUNNER_TEMP/website-dispatch.txt"
          {
            echo "### Test website dispatch"
            echo "Dispatched Website (website.yml) on main, mode production, for $RELEASE_TAG."
            echo 'Origin: https://test-devcapsule.mycodespace.ai; base path: /.'
            cat "$RUNNER_TEMP/website-dispatch.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize the release
        run: |
          {
            echo "## DevCapsule PEX release"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Revision: \`$(git rev-parse HEAD)\`"
            echo "- Executables:"
            sed 's/^/  - /' dist/SHA256SUMS
            echo "- Built and retested after downloading from GitHub Releases"
          } >> "$GITHUB_STEP_SUMMARY"
