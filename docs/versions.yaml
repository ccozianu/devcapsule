# The documentation versions the website publishes; contract version 1.
# Authoritative on main. Promote the released version after each final tag
# and demote the previous ones, per the release runbook.
contract: 1
current: "0.2.15"
notice: >
  DevCapsule 0.x is for early adopters. We publish the documentation of every
  released version, and we ask you to run the current release: it is the one
  we fix. Whether we patch a release older than two weeks is at our
  discretion. A support policy with defined windows will come with V1.
versions:
  - version: devel
    source: main
    # On release-0.3.0 only: the branch's source declares the release
    # version, and the website's check reads this checkout as main. The
    # line satisfies contract 1, section 4.2, for the local gate; it is not
    # carried to main, whose source declares a development version.
    source-version: "0.3.0"
    status: development
  - version: "0.2.15"
    source: docs-0.2.15
    status: supported
  - version: "0.2.14"
    source: v0.2.14
    status: deprecated
    legacy: true
    note: The install steps in this version refer to an earlier download; follow the current guide.
  - version: "0.2.12"
    source: a989155385026b2e5f80cedb5edc8e1e0f4a6bbd
    source-version: 0.2.14.dev0
    status: deprecated
    legacy: true
    note: Its guides were written after the tag; this is the commit that holds them.
